<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密码 · 本地漫画库</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="/">
        <span class="brand-mark">漫</span>
        <span>本地漫画库</span>
      </a>
      <p class="eyebrow">PASSWORD CHANGE</p>
      <h1>修改登录密码</h1>
      <p class="summary">首次使用默认管理员密码时必须先完成修改。</p>
      <form id="passwordForm" class="download-form">
        <label>
          当前密码
          <input id="currentPassword" type="password" autocomplete="current-password" required>
        </label>
        <label>
          新密码
          <input id="newPassword" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <label>
          确认新密码
          <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <p id="passwordMessage" class="form-message"></p>
        <div class="confirm-actions">
          <a class="text-button" href="/login">返回登录</a>
          <button id="passwordSubmit" class="text-button accent-button" type="submit">
            修改密码
          </button>
        </div>
      </form>
    </section>
  </main>
  <script src="/static/change_password.js" defer></script>
</body>
</html>
