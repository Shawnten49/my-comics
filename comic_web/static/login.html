<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 本地漫画库</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="/">
        <span class="brand-mark">漫</span>
        <span>本地漫画库</span>
      </a>
      <p class="eyebrow" id="authEyebrow">ACCOUNT</p>
      <h1 id="authTitle">登录漫画库</h1>
      <p class="summary" id="authDescription">游客可直接浏览公开漫画。</p>
      <form id="authForm" class="download-form">
        <label id="setupTokenField" class="hidden">
          初始化令牌
          <input id="setupToken" type="password" autocomplete="off">
        </label>
        <label>
          用户名
          <input id="authUsername" type="text" autocomplete="username" required>
        </label>
        <label>
          密码
          <input id="authPassword" type="password" autocomplete="current-password" required>
        </label>
        <p id="authMessage" class="form-message"></p>
        <div class="confirm-actions">
          <a class="text-button" href="/">返回首页</a>
          <button id="authSubmit" class="text-button accent-button" type="submit">登录</button>
        </div>
      </form>
    </section>
  </main>
  <script src="/static/login.js" defer></script>
</body>
</html>
